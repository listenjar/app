# The app repo on its own (CI, or a checkout outside the monorepo). Inside
# the listenjar monorepo, its workspace runs these tasks as app:<task> too.
defaultProject: app
projects:
  app: .
versionConstraint: ">=2.6.5 <3.0.0"
vcs:
  client: git
  defaultBranch: master
pipeline:
  installDependencies: false
  syncProjects: false
  syncWorkspace: false
hasher:
  walkStrategy: glob
# Cached task outputs in content-addressed storage, shared by every git
# worktree of this repository (the monorepo's .moon/workspace.yml does the same).
cache:
  unstable_sharedWorktreeCache: true
experiments:
  casOutputsCache: true
