# Releases Listenjar from a vX.Y.Z tag whose packages/desktop/pubspec.yaml
# says X.Y.Z+N: version.yaml reserves one on every push to master and
# dispatches this on it (a pushed tag starts this too). Each platform builds
# on its own runner into build/release/ (`moon run app:package-<platform>`,
# tool/package-windows.ps1 on Windows x64 and arm64), `node tool/release.ts prepare` signs
# the macOS and Windows packages for their updaters and writes their appcasts
# (lib/updates.dart), and publish uploads all seven packages and only then
# makes the release the latest, which is what the updaters read: the appcasts
# on macOS and Windows, manifest-android-<abi>.json on Android (lib/apk_updates.dart).
# Every package gets a build provenance attestation before it goes up. The APKs
# are signed with the one permanent release key (tool/release.dart checks it
# against passkeys.ts), which is also what lets Android install them over the
# installed app.
#
# The signing secrets and variables live in the desktop-release environment,
# which only v* tags can use (apps/desktop-signing in listenjar/listenjar
# fills it from ~/.secrets/listenjar/desktop-signing; DEVELOPMENT.md's "Releases").
name: Release
on:
  push:
    tags: [v*]
  workflow_dispatch:
permissions:
  contents: read
# Only the newest release builds: version.yaml dispatches one per push to
# master, in order, and each cancels the one before it. A publish already
# under way finishes instead (see publish), and the newer run waits for it.
# Branch dispatches, test builds that publish nothing, keep to their own group.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: true
env:
  MISE_VERSION: '2026.11.11'
jobs:
  # Moon runs task scripts with bash here, which Windows lacks: Windows takes
  # the generated code from this job.
  generate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: flutter node aube github:responsibleapi/oasmith aqua:moonrepo/moon
      - name: Check the tag against pubspec.yaml
        id: identity
        run: node tool/release.ts identity "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - name: Generate the API client, prices and YouTube.js scripts
        run: moon run app:codegen app:scripts
      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            packages/desktop/lib/backend
            packages/desktop/lib/pricing
            packages/youtubei/native/scripts.g.c
            packages/youtubei/native/youtubejs.js
          if-no-files-found: error

  macos:
    needs: generate
    runs-on: macos-26
    environment: desktop-release
    env:
      LISTENJAR_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: flutter node aube github:responsibleapi/oasmith aqua:moonrepo/moon
      - name: Import the Developer ID certificate and notary key
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tool/macos-signing.sh setup
      # https://github.com/actions/runner-images/issues/14924
      - name: Fetch notarization tickets over TCP
        run: |
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Build, sign, notarize and package the DMG
        run: moon run app:package-macos
      - name: Sign the DMG for Sparkle and write its appcast
        env:
          MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
          MACOS_UPDATE_SEED_BASE64: ${{ secrets.MACOS_UPDATE_SEED_BASE64 }}
        run: >-
          node tool/release.ts prepare macos
          "build/release/Listenjar-${{ needs.generate.outputs.version }}-macos.dmg" release-macos
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-macos/*
          if-no-files-found: error
      - name: Remove the keychain and credentials
        if: always()
        run: bash tool/macos-signing.sh cleanup

  # x64 and arm64, each on its own architecture: Flutter builds Windows only
  # for the machine it runs on.
  windows:
    name: windows-${{ matrix.arch }}
    needs: generate
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            # packages/youtubei builds QuickJS with MSYS2's MinGW-w64 compiler.
            msystem: UCRT64
            compiler: mingw-w64-ucrt-x86_64-gcc
            # Off the hidden AppData: smtc_windows' cargokit resolves its own
            # path with Get-Item, which cannot see hidden folders.
            pub-cache: D:\pub-cache
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            compiler: mingw-w64-clang-aarch64-clang
            pub-cache: C:\pub-cache
    env:
      LISTENJAR_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
      PUB_CACHE: ${{ matrix.pub-cache }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep Unix line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: packages
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ matrix.arch == 'x64' && 'flutter node' || 'node' }}
      # Flutter publishes no arm64 Windows SDK; its checkout fetches the arm64
      # Dart SDK on first run. The same version mise.toml pins.
      - name: Install Flutter from its tag
        if: matrix.arch == 'arm64'
        run: |
          $version = (Select-String -Path mise.toml -Pattern '^flutter = "(.+)"').Matches[0].Groups[1].Value
          git clone --quiet --depth 1 --branch $version https://github.com/flutter/flutter.git C:\flutter
          if ($LASTEXITCODE -ne 0) { throw "No Flutter $version." }
          Add-Content $env:GITHUB_PATH 'C:\flutter\bin'
      # No package cache: each release runs on its own tag, whose caches the
      # next tag cannot restore, and saving it runs paccache, which can fail
      # the job on its own (exit 4 on windows-11-arm).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false
          cache: false
          install: ${{ matrix.compiler }}
      # The compiler's own programs and DLLs live in its environment's bin.
      - name: Put the MinGW-w64 compiler on PATH
        run: Add-Content $env:GITHUB_PATH "C:\msys64\$('${{ matrix.msystem }}'.ToLower())\bin"
      - name: Install Inno Setup 6.7.3, checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed.' }
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch.' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Inno Setup is not signed by its publisher.' }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build and package the installer
        run: ./tool/package-windows.ps1
      # MSBuild only says "Building native assets failed".
      - name: Show the build hooks' output
        if: failure()
        run: |
          Get-ChildItem -Recurse -Include stdout.txt,stderr.txt -Path .dart_tool/hooks_runner -ErrorAction SilentlyContinue |
            ForEach-Object { "==== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
      - name: Sign the installer for WinSparkle and write its appcast
        env:
          WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
          WINDOWS_UPDATE_SEED_BASE64: ${{ secrets.WINDOWS_UPDATE_SEED_BASE64 }}
        run: >-
          node tool/release.ts prepare windows-${{ matrix.arch }}
          "build/release/Listenjar-${{ needs.generate.outputs.version }}-windows-${{ matrix.arch }}-setup.exe" release-windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: release-windows-${{ matrix.arch }}/*
          if-no-files-found: error

  linux:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Flutter's Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          liblzma-dev libstdc++-12-dev libsecret-1-dev libx11-dev libxi-dev libmpv-dev
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: flutter node aube github:responsibleapi/oasmith aqua:moonrepo/moon
      - run: flutter pub get --enforce-lockfile
      - run: moon run app:package-linux
      - name: Write its manifest
        run: >-
          node tool/release.ts prepare linux-x64
          "build/release/Listenjar-${{ needs.generate.outputs.version }}-linux-x64.tar.gz" release-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release-linux-x64/*
          if-no-files-found: error

  android:
    needs: generate
    runs-on: ubuntu-24.04
    environment: desktop-release
    env:
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Flutter's Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          liblzma-dev libstdc++-12-dev libsecret-1-dev libx11-dev libxi-dev libmpv-dev
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: flutter node aube github:responsibleapi/oasmith aqua:moonrepo/moon java android-sdk
      - run: flutter pub get --enforce-lockfile
      # settings.gradle.kts resolves the app from Google's repositories; this
      # covers the Gradle builds it includes too, such as Flutter's plugin.
      - name: Resolve everything through Google's repositories
        run: install -D -m 644 tool/maven-mirror.gradle ~/.gradle/init.d/maven-mirror.gradle
      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printenv ANDROID_KEYSTORE_BASE64 | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build, sign with the release key and package an APK per ABI
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: moon run app:package-android
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      # The manifests are also the in-app updater's feeds (lib/apk_updates.dart).
      - name: Write their manifests
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            node tool/release.ts prepare "android-$abi" "build/release/Listenjar-$VERSION-android-$abi.apk" release-android
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-android/*
          if-no-files-found: error

  # Every release goes to TestFlight too, for iPhone and iPad: signed for the
  # App Store, added to the external "Public" group (its public link takes up
  # to 10,000 testers) and submitted to Beta App Review (tool/testflight.ts).
  # The GitHub release doesn't wait for it. It runs on the Xcode 27 image, as
  # App Store Connect takes only iOS 27 SDK builds from April 2027 (ITMS-90725).
  ios:
    if: github.ref_type == 'tag'
    needs: generate
    runs-on: xcode-27
    environment: desktop-release
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: flutter node aube github:responsibleapi/oasmith aqua:moonrepo/moon
      - name: Import the Apple Distribution certificate, App Store profiles and API key
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: bash tool/ios-signing.sh setup
      - name: Build, sign and export the IPA
        run: moon run app:package-ios
      - name: Upload to TestFlight, add to the public group and submit for review
        run: node tool/testflight.ts "build/release/Listenjar-${{ needs.generate.outputs.version }}-ios.ipa"
      - name: Remove the keychain and credentials
        if: always()
        run: bash tool/ios-signing.sh cleanup

  # always() keeps a publish that has started from being cancelled by a newer
  # release (a cancel re-evaluates it with every build already succeeded),
  # so it never leaves a half-uploaded draft; the result checks stand in for
  # the default success() before it starts.
  publish:
    if: >-
      always() && github.ref_type == 'tag'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && !contains(needs.*.result, 'skipped')
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-24.04
    environment: desktop-release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      # Build provenance attestations: Sigstore's certificate and GitHub's store.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
      WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.WINDOWS_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Verify every platform's package, signature and appcast
        run: node tool/release.ts verify artifacts
      # Anyone can check that a download came from this workflow at this
      # commit: `gh attestation verify <file> --repo listenjar/app`.
      - name: Attest each package's build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/Listenjar-*
      - name: Upload and make it the latest release
        run: node tool/release.ts publish artifacts
