org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# lib/background.dart runs the hourly sync as a dataSync foreground service:
# long videos outlast a plain job. (A Play Console special type: declare it.)
workmanager.enableDataSyncForegroundService=true
# Release APKs are split per ABI (tool/release.dart), all with pubspec.yaml's
# build number as their versionCode, not Flutter's 1000 * ABI + build: the
# updater (lib/apk_updates.dart) compares it with the manifest's build, and
# Listenjar isn't on Play, which would need them to differ.
force-version-code-ignoring-abi=true
