    sdk: flutter
  cancellation_token: ^2.0.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  material_ui: ^1.1.0
  sqlite3: ^3.9.2
  url_launcher: ^6.3.3
  youtubei: any
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  nativeapi_flutter: ^0.6.2
  nativeapi: ^0.6.2
  workmanager: ^0.10.10
  file_selector: ^1.1.0
  image: ^4.13.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  audio_service_mpris: ^0.2.1
  smtc_windows: ^1.1.0
