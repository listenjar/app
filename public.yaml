openapi: 3.2.0
info:
  title: ListenJar Public API
  version: 0.1.0
  description: >-
    The API the ListenJar desktop app calls. The listeners-backend Cloudflare
    Worker serves it next to its private API, and publishes this document at
    `/public.yaml`.


    Signing in: the app signs in by itself, in the same three ways as
    listenjar.com, each into the same account (a user is their email), and
    each answering a `Session` whose token lasts a year. It sends the token as
    `Authorization: Bearer <token>`.


    - Google (RFC 8252, loopback redirect with PKCE): the app listens on
      `http://127.0.0.1:<port>/`, asks `desktopGoogleAuthUrl` for Google's
      address with that redirect, its `state` and its PKCE challenge, and opens
      it in the browser. Google comes back to the app's address with `code`
      and `state` (or `error=access_denied`), and the app trades the code with
      `signInWithGoogle`. Google never shows in a web view.

    - Email and password: `signInWithPassword`. `signUp` and
      `requestPasswordLink` email a link that opens on listenjar.com, which
      makes the account or sets its password; the person then signs in here
      with that password.

    - Passkeys: the platform's own passkey prompt (macOS and iOS with the
      `webcredentials:listenjar.com` Associated Domain, Android's Credential
      Manager, Windows Hello) answers `passkeySignInOptions`, and
      `signInWithPasskey` checks the answer. The passkeys are listenjar.com's,
      so one made on the website signs in here too.


    The app used to sign in through the browser instead: it opens
    `https://listenjar.com/desktop/authorize?redirect_uri=…&code_challenge=…&code_challenge_method=S256&state=…`,
    the person signs in there and allows the app, and the browser comes back
    to the app's loopback address with a code for `createDesktopToken`. That
    still works.


    Feeds: the listener's feeds are under `/me/feeds`. The app adds a YouTube
    video, playlist or channel with `addFeed` after reading its title from
    YouTube itself. Free listeners add videos only, each its own podcast,
    removed a day after it was added (`Feed.expiresAt`). Paying listeners
    (`User.plan`, 10 GB or 100 GB) keep what they add, and also add playlists
    and channels, which follow their YouTube source, and podcasts of their own
    (`addFeed` without a source), whose episodes are whatever videos they add,
    including the video of one of their YouTube video feeds. Their plan caps
    what they store: each video counts once, however many of their feeds have
    it.


    Syncing: the app keeps each feed in step with its source. It lists what the
    feed has (`listEpisodes`) and adds each missing video (`createEpisode`).
    An episode is keyed by its source, the canonical URL of what it was made
    from (`Episode.sourceUrl`, a YouTube video's watch URL), and each source's
    audio is stored once, shared by every feed that has it, under a key that
    is a hash of that URL, so an episode whose source someone already
    uploaded is live at once. For the
    rest, the app downloads the audio on the listener's computer, asks for an
    upload address (`createUpload`, a presigned S3 `PUT` straight to the R2
    media bucket), uploads, and confirms (`completeEpisode`), which puts the
    episode in the RSS of every feed that has the source. Videos gone from a
    playlist or channel leave the feed through `deleteEpisode`; a podcast of
    the listener's own changes only when they add or remove videos. A
    playlist's RSS is a serial show: the app numbers its episodes in the
    playlist's order (`NewEpisode.number`), and numbers them again when the
    playlist is reordered (`numberEpisodes`), so podcast apps list them as
    the playlist does.


    Uploads: every file the app stores, an episode's audio or a podcast's
    artwork, goes the same way. The app asks for an upload (`NewUpload`: the
    file's type and exact size), gets a `PresignedUpload` (a presigned S3
    `PUT` straight to the R2 bucket that keeps it, and the headers to send
    with it, exactly), uploads, and confirms, which checks the object and
    makes it live. Stored files never change: new artwork is a new URL, so
    every file is cached for a year.


    Artwork: a YouTube feed shows its source's, as YouTube serves it. A
    podcast of the listener's own shows what they upload
    (`createImageUpload`, then `completeImage`), from images.listenjar.com.


    Storage: the server counts who holds each source's audio, per listener and
    source, one for each episode of theirs that has it. Adding an episode counts
    it; removing an episode or a feed (`deleteEpisode`, `deleteFeed`, or a free
    feed expiring) uncounts it. A listener's storage is every source they hold,
    once; audio nobody holds any more is deleted from the media bucket.
    Only YouTube audio the app uploads counts: classic podcasts play from
    their own publishers' servers and never use the plan's storage, nor does
    artwork or the library.


    Library: with ListenJar Cloud, the app keeps the listener's library the
    same on every device the classic way (`pullLibrary`, `pushLibrary`,
    `watchLibrary`): the RSS shows they follow, where they are in each
    episode, and Up Next. Nothing in it is about YouTube: a playlist, channel
    or podcast of the listener's own joins it as the RSS feed ListenJar
    hosts for it (`Feed.rssUrl`). The server stores each
    `LibraryRecord` as the app sends it and never reads its `data`; the
    newest `updatedAt` wins, and a removed record stays, `deleted`, so every
    device learns it went. Feeds under `/me/feeds` sync on their own.
servers:
  - url: https://api.listenjar.com
    description: Production.
  - url: http://localhost:8787
    description: Development, the backend's local dev server.
security:
  - token: []
paths:
  /feeds:
    get:
      operationId: listFeeds
      summary: List feeds that belong to no listener
      description: >-
        Listeners' own feeds are never listed here; the app reads those from
        `/me/feeds`.
      security: []
      responses:
        "200":
          description: Feeds, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
  /feeds/{id}:
    get:
      operationId: getFeed
      summary: Get one feed
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "404":
          description: No feed with that id.
  /me/feeds:
    get:
      operationId: listMyFeeds
      summary: The signed-in listener's feeds
      responses:
        "200":
          description: The listener's feeds, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
        "401":
          description: The token is missing, revoked or expired.
    post:
      operationId: addFeed
      summary: Add a YouTube video, playlist or channel as a feed, or a podcast of the listener's own
      description: >-
        The app reads the title and artwork from YouTube; the server never
        calls YouTube. `source.url` must be canonical: `https://www.youtube.com/watch?v=<id>`,
        `https://www.youtube.com/playlist?list=<id>` or
        `https://www.youtube.com/channel/<UC id>`. Adding a source the listener
        already has returns that feed. Without a source, it is a new podcast of
        the listener's own, which they fill with `createEpisode`. A feed has
        no RSS until its first episode is live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFeed"
      responses:
        "200":
          description: The listener already had this source; its feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "201":
          description: The new feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: The source is not a canonical YouTube video, playlist or channel URL, or the title is empty.
        "401":
          description: The token is missing, revoked or expired.
        "402":
          description: Only listeners with ListenJar Cloud (10 GB, 100 GB) add playlists, channels and podcasts of their own; not Free or Local.
  /me/feeds/events:
    get:
      operationId: watchMyFeeds
      summary: The signed-in listener's feeds, live
      description: >-
        Server-sent events. The first event is the whole list, as
        `listMyFeeds` returns it; another follows whenever it changes: a feed
        added or removed on any device, an episode uploaded, a plan started or
        ended. Each event's `data` is a `FeedList`. A `: ping` comment every 25
        seconds keeps proxies from closing it. The stream ends when the
        session does (signed out, expired) or after about 15 minutes, when a
        client reconnects and gets the list afresh.
      responses:
        "200":
          description: The listener's feeds, then the list again on every change.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/FeedList"
        "401":
          description: The token is missing, revoked or expired.
  /me/feeds/{feedId}:
    delete:
      operationId: deleteFeed
      summary: Remove a feed, its episodes and its RSS
      description: >-
        The listener stops holding its videos: their storage goes down by
        those no other feed of theirs has, and audio nobody else holds is
        deleted with it.
      parameters:
        - $ref: "#/components/parameters/feedId"
      responses:
        "204":
          description: Removed.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no feed with that id.
  /me/feeds/{feedId}/synced:
    post:
      operationId: markFeedSynced
      summary: Say the app just finished checking a feed's source on YouTube
      description: >-
        Call it after each pass over a YouTube feed that ended up to date:
        every new video added, nothing left failing. Sets the feed's
        `syncedAt`, which the dashboard on listenjar.com shows.
      parameters:
        - $ref: "#/components/parameters/feedId"
      responses:
        "204":
          description: Noted.
        "400":
          description: The feed is a podcast of the listener's own, with no YouTube source.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no feed with that id.
  /me/feeds/{feedId}/image/upload:
    post:
      operationId: createImageUpload
      summary: Get an address to upload a podcast's artwork to
      description: >-
        For a podcast of the listener's own; a YouTube feed shows its source's
        artwork. A square JPEG or PNG, 1400 to 3000 pixels a side, is what
        podcast apps ask for. Returns a presigned `PUT` to the R2 images
        bucket, valid for `expiresAt`. Send the file's bytes with the
        returned headers, then call `completeImage`. Asking again replaces the
        upload asked for before. Artwork doesn't count against the plan's
        storage.
      parameters:
        - $ref: "#/components/parameters/feedId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUpload"
      responses:
        "201":
          description: Where to upload the artwork.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "400":
          description: >-
            The content type is not image/jpeg or image/png, the size is over
            10 MB, or the feed follows a YouTube source.
        "401":
          description: The token is missing, revoked or expired.
        "402":
          description: Podcasts of the listener's own take artwork while the listener has ListenJar Cloud (10 GB, 100 GB).
        "404":
          description: The listener has no feed with that id.
  /me/feeds/{feedId}/image/complete:
    post:
      operationId: completeImage
      summary: Confirm an artwork upload and show it
      description: >-
        Checks that the image is in the bucket with the size and type
        `createImageUpload` was given, makes it the feed's `imageUrl`,
        republishes the RSS and deletes the artwork it replaces.
      parameters:
        - $ref: "#/components/parameters/feedId"
      responses:
        "200":
          description: The feed, with its new artwork.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Nothing was asked to be uploaded, or the image is missing or differs; upload again.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no feed with that id.
  /me/feeds/{feedId}/episodes:
    get:
      operationId: listEpisodes
      summary: Every episode of a feed, uploaded or not
      description: >-
        The sync inventory: an episode without `uploadedAt` has no audio yet,
        so the app downloads and uploads it.
      parameters:
        - $ref: "#/components/parameters/feedId"
      responses:
        "200":
          description: Episodes, newest published first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no feed with that id.
    post:
      operationId: createEpisode
      summary: Add a video to a feed
      description: >-
        Records the episode, or updates the title, description and dates of
        the one the feed already has for this video. When the video's audio
        is already uploaded, the episode is live at once (`uploadedAt` is
        set) and the RSS is republished; otherwise upload it with
        `createUpload`. A video feed takes only its own video; playlists,
        channels and podcasts of the listener's own take any, while the
        listener pays. Adding a video another feed of the listener's already
        has, such as a video feed's to a podcast of their own, costs no
        storage.
      parameters:
        - $ref: "#/components/parameters/feedId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEpisode"
      responses:
        "200":
          description: The feed already had this video; its episode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "201":
          description: The new episode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: A field is missing or out of range, or the feed is a different video's.
        "401":
          description: The token is missing, revoked or expired.
        "402":
          description: The feed is a playlist, channel or podcast of the listener's own, and the listener no longer has ListenJar Cloud (10 GB, 100 GB).
        "404":
          description: The listener has no feed with that id.
        "507":
          description: The video's audio is already uploaded, and it would take the listener past their plan's storage.
  /me/feeds/{feedId}/numbers:
    put:
      operationId: numberEpisodes
      summary: Number a feed's episodes in an order
      description: >-
        Each episode whose source is in `sourceUrls` is numbered by its place
        there, the first being 1; the others keep theirs. When a number
        changes, the RSS is republished.
      parameters:
        - $ref: "#/components/parameters/feedId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeNumbers"
      responses:
        "204":
          description: The episodes are numbered.
        "400":
          description: A source isn't a canonical YouTube watch URL, or there are too many.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no feed with that id.
  /me/feeds/{feedId}/episodes/{episodeId}:
    delete:
      operationId: deleteEpisode
      summary: Remove an episode and republish the RSS
      description: >-
        The listener's storage goes down by its audio unless another feed of
        theirs has the video, and the audio is deleted when nobody else holds
        it.
      parameters:
        - $ref: "#/components/parameters/feedId"
        - $ref: "#/components/parameters/episodeId"
      responses:
        "204":
          description: Removed.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no such episode.
  /me/feeds/{feedId}/episodes/{episodeId}/upload:
    post:
      operationId: createUpload
      summary: Get an address to upload an episode's audio to
      description: >-
        Returns a presigned `PUT` to the R2 media bucket, valid for
        `expiresAt`. Send the file's bytes with the returned headers, then
        call `completeEpisode`. A video's audio is uploaded once for every
        feed: while it is not uploaded, asking again (from any feed) replaces
        the size and type the upload must have.
      parameters:
        - $ref: "#/components/parameters/feedId"
        - $ref: "#/components/parameters/episodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUpload"
      responses:
        "201":
          description: Where to upload the audio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "400":
          description: The size is out of range, or the content type is not audio/mp4 or audio/webm.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no such episode.
        "409":
          description: The video's audio is already uploaded; the episode is live.
        "507":
          description: The audio would take the listener past their plan's storage.
  /me/feeds/{feedId}/episodes/{episodeId}/complete:
    post:
      operationId: completeEpisode
      summary: Confirm an upload and publish the episode
      description: >-
        Checks that the media object exists with the `byteLength` that
        `createUpload` was given, marks the video's audio uploaded and
        republishes the RSS of every feed that has the video. Completing an
        uploaded episode again returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/feedId"
        - $ref: "#/components/parameters/episodeId"
      responses:
        "200":
          description: The uploaded episode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: Nothing was asked to be uploaded, or the media object is missing or its size differs; upload again.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The listener has no such episode.
  /desktop/google/url:
    get:
      operationId: desktopGoogleAuthUrl
      summary: Google's authorization URL for the app to open in the browser
      description: >-
        For the "ListenJar desktop" Google client, which asks for `openid
        profile email` and sends the browser back to `redirectUri`, the app's
        loopback address. The app keeps `state` and the PKCE verifier behind
        `codeChallenge` (S256) until Google does.
      security: []
      parameters:
        - name: redirectUri
          in: query
          required: true
          description: "`http://127.0.0.1:<port>/`, `http://[::1]:<port>/` or `http://localhost:<port>/`."
          schema:
            type: string
            format: uri
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: codeChallenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUrl"
        "400":
          description: A parameter is missing, or the redirect isn't a loopback address with a port.
  /desktop/google:
    post:
      operationId: signInWithGoogle
      summary: Trade Google's authorization code for the app's token
      description: >-
        Exchanges the code with Google, reads the person's Google account and
        signs into its user: the one it signed in before, else the one with its
        verified email, else a new one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignIn"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Google refused the code, or the account has no verified email.
  /desktop/password:
    post:
      operationId: signInWithPassword
      summary: Sign in with an email and password
      description: >-
        Ten wrong passwords for an address within 15 minutes, on the website
        or here, and it answers 429 until the oldest is that old.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSignIn"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: No email or password.
        "401":
          description: >-
            No account with that email and password: none at all, one that
            signs in only with Google or passkeys, or a wrong password.
        "429":
          description: Too many wrong passwords for the address lately.
  /desktop/signups:
    post:
      operationId: signUp
      summary: Start a password sign-up
      description: >-
        Emails the address a link to listenjar.com, valid for 24 hours, that
        makes the account with this password; the person then signs in here
        with it. An address that has an account gets an email saying so
        instead, with a link that sets a password. At most three emails of
        either kind go to an address in 10 minutes. The answer is the same
        either way, so it never tells who has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUp"
      responses:
        "202":
          description: An email is on its way, whether or not the address has an account.
        "400":
          description: Not an email address, or the password is shorter than 8 or longer than 256 characters.
  /desktop/password-resets:
    post:
      operationId: requestPasswordLink
      summary: Email a link that sets the account's password
      description: >-
        Emails the address, if it has an account, a link to listenjar.com,
        valid for an hour, that sets a new password, or a first one for an
        account that signs in only with Google or passkeys. Setting it signs
        the account out everywhere, this app too. At most three go to an
        address in 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLinkRequest"
      responses:
        "202":
          description: Sent if the address has an account.
        "400":
          description: Not an email address.
  /desktop/passkey/options:
    post:
      operationId: passkeySignInOptions
      summary: Options for signing in with any passkey
      description: >-
        PublicKeyCredentialRequestOptionsJSON for the platform's passkey
        prompt, with `rpId` (listenjar.com; localhost in development) and no
        credentials listed, so it offers every ListenJar passkey it has. The
        challenge works once, for five minutes.
      security: []
      responses:
        "200":
          description: PublicKeyCredentialRequestOptionsJSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnJson"
  /desktop/passkey:
    post:
      operationId: signInWithPasskey
      summary: Sign in with a passkey
      description: >-
        Takes the platform's answer as AuthenticationResponseJSON. Its client
        data must be signed for `https://<rpId>` (macOS, iOS, Windows) or by
        an Android build that listenjar.com's assetlinks.json lists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnJson"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Not a WebAuthn answer.
        "401":
          description: >-
            The passkey belongs to no account (removed, perhaps), or the
            answer doesn't check out.
  /desktop/token:
    post:
      operationId: createDesktopToken
      summary: Trade the code from the browser for the app's token
      description: >-
        The code is single-use and expires five minutes after the person
        allowed the app. `codeVerifier` must hash (S256) to the
        `code_challenge` the app opened the browser with, and `redirectUri`
        must be the same loopback address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopTokenRequest"
      responses:
        "200":
          description: The app is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The code is unknown, used, expired, or does not match the verifier or redirect URI.
  /billing/checkout:
    post:
      operationId: createCheckout
      summary: Start subscribing the signed-in user to a plan
      description: >-
        A Stripe Checkout Session for the plan's price, linked to the user
        (its `client_reference_id` is their id). The app opens `url` in the
        browser; Stripe sends it back to `returnUrl`, which brings the app to
        the front, whether they paid or left. The webhook makes them paid, and
        `getMe` says so from then on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Where to pay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeRedirect"
        "400":
          description: Not a plan's price, or a `returnUrl` that isn't the app's.
        "401":
          description: The token is missing, revoked or expired.
        "409":
          description: The user pays already (Local included); they change plans in the billing portal.
  /billing/portal:
    post:
      operationId: createBillingPortal
      summary: Let the signed-in user change or cancel their plan
      description: A Stripe billing portal session; Stripe sends the browser back to `returnUrl`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPortalRequest"
      responses:
        "201":
          description: Where to manage the plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeRedirect"
        "400":
          description: A `returnUrl` that isn't the app's.
        "401":
          description: The token is missing, revoked or expired.
        "404":
          description: The user never subscribed.
  /me/library:
    get:
      operationId: pullLibrary
      summary: What changed in the listener's library since a version
      description: >-
        The records whose version is above `since`, oldest change first, a
        page at a time: up to about a thousand, never splitting one push. A
        device keeps the answer's `version` and asks again from there while
        `more` is true. `since` 0 is the whole library.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The records above `since`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryChanges"
        "400":
          description: "`since` isn't a whole number."
        "401":
          description: The token is missing, revoked or expired.
        "402":
          description: The listener's plan has no ListenJar Cloud (Free, Local).
    post:
      operationId: pushLibrary
      summary: Record changes the listener made on this device
      description: >-
        Each record replaces the one stored for its `kind`, `show` and `item`
        unless that one's `updatedAt` is as new or newer. The ones that land
        take the listener's next version, which other devices pull.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryPush"
      responses:
        "204":
          description: Recorded.
        "400":
          description: A record is malformed, or there are more than 500, or the body is over 1 MB.
        "401":
          description: The token is missing, revoked or expired.
        "402":
          description: The listener's plan has no ListenJar Cloud (Free, Local).
  /me/library/events:
    get:
      operationId: watchLibrary
      summary: The listener's library version, live
      description: >-
        Server-sent events. The first event is the library's version now;
        another follows whenever a push moves it, from any device. Each
        event's `data` is a `LibraryVersion`: a device pulls when it is above
        what it has. Pings and the stream's end are as for `watchMyFeeds`.
      responses:
        "200":
          description: The library's version, then again on every change.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/LibraryVersion"
        "401":
          description: The token is missing, revoked or expired.
        "402":
          description: The listener's plan has no ListenJar Cloud (Free, Local).
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user the token belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: The token is missing, revoked or expired.
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything of it
      description: >-
        Cancels every live Stripe subscription of the account at once, with
        no refund, then deletes its feeds (their RSS, the audio nobody else
        holds, their artwork), its sessions on every device, its sign-in
        methods and the account itself. It can't be undone. Safe to retry:
        a call that fails partway leaves the token working, and calling
        again finishes the job; once the account is gone the token answers
        401.
      responses:
        "204":
          description: The account is deleted; the token no longer works.
        "401":
          description: The token is missing, revoked or expired, or the account is already deleted.
  /logout:
    post:
      operationId: logout
      summary: Revoke the token
      responses:
        "204":
          description: Signed out; the token no longer works.
        "401":
          description: The token is missing, revoked or expired.
components:
  parameters:
    feedId:
      name: feedId
      in: path
      required: true
      schema:
        type: string
    episodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: The token from `createDesktopToken`.
  schemas:
    CheckoutRequest:
      type: object
      required: [price]
      properties:
        price:
          type: string
          description: >-
            A plan price's Stripe lookup key from the pricing catalog
            (pricing/catalog.live.json), such as `listenjar_10gb_yearly`.
        returnUrl:
          $ref: "#/components/schemas/AppReturnUrl"
    BillingPortalRequest:
      type: object
      properties:
        returnUrl:
          $ref: "#/components/schemas/AppReturnUrl"
    AppReturnUrl:
      type: string
      format: uri
      description: >-
        Where Stripe sends the browser back: an address of the app's
        `listenjar:` scheme (`listenjar-dev:` for debug builds), such as
        `listenjar://plans`, which brings the app to the front. Without it,
        the website.
    StripeRedirect:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    Feed:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/Source"
          description: >-
            The YouTube video, playlist or channel the feed follows. Absent on
            a podcast of the listener's own.
        imageUrl:
          type: string
          format: uri
          description: >-
            The feed's artwork: its source's, as YouTube serves it, or what the
            listener uploaded for a podcast of their own (`completeImage`).
        syncedAt:
          type: string
          format: date-time
          description: >-
            When the ListenJar app last finished checking the feed's YouTube
            source for new videos (`markFeedSynced`). Only on the listener's
            own YouTube feeds, once the app has checked.
        episodeCount:
          type: integer
          minimum: 0
          description: Episodes uploaded to R2 and in the RSS. Only on the listener's own feeds.
        rssUrl:
          type: string
          format: uri
          description: >-
            The feed's public RSS, for the listener's podcast app. Only on the listener's own feeds, and
            only once an episode is uploaded: until then there is no RSS to subscribe to.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the feed is removed, with its episodes and RSS: a day after a
            free listener added it, unless they start paying first. Absent
            while the listener pays.
    SourceKind:
      type: string
      enum: [video, playlist, channel]
    Source:
      type: object
      required: [kind, url]
      properties:
        kind:
          $ref: "#/components/schemas/SourceKind"
        url:
          type: string
          format: uri
          description: Canonical YouTube URL of the video, playlist or channel (`/channel/UC…`).
    FeedList:
      type: object
      description: One `watchMyFeeds` event.
      required: [feeds]
      properties:
        feeds:
          type: array
          description: The listener's feeds, newest first.
          items:
            $ref: "#/components/schemas/Feed"
    NewFeed:
      type: object
      required: [title]
      properties:
        source:
          $ref: "#/components/schemas/Source"
          description: Omitted for a podcast of the listener's own (paying listeners only).
        title:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri
    Episode:
      type: object
      required: [id, sourceUrl, title, publishedAt, createdAt]
      properties:
        id:
          type: string
        sourceUrl:
          type: string
          format: uri
          description: >-
            What the episode was made from, its canonical URL: a YouTube
            video's watch URL. Episodes, and the audio stored for them, are
            keyed by it, and it is the episode's `<link>` in the RSS.
        title:
          type: string
        publishedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
          description: Its number, `<itunes:episode>`; a playlist's place in it.
        contentType:
          type: string
          description: The audio's type; present once an upload was asked for.
        byteLength:
          type: integer
          minimum: 1
          description: The audio's size; present once an upload was asked for.
        createdAt:
          type: string
          format: date-time
        uploadedAt:
          type: string
          format: date-time
          description: When the video's audio was uploaded; absent until then.
        mediaUrl:
          type: string
          format: uri
          description: The public media URL; present once uploaded.
    NewEpisode:
      type: object
      required: [sourceUrl, title, publishedAt]
      properties:
        sourceUrl:
          type: string
          format: uri
          pattern: "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{11}$"
          description: The canonical URL of what the episode is made from, a YouTube video's watch URL.
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        publishedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
          description: >-
            Its number, `<itunes:episode>`: in a playlist, its place there,
            the first being 1. Omitted, an episode the feed has keeps its
            number.
    EpisodeNumbers:
      type: object
      required: [sourceUrls]
      properties:
        sourceUrls:
          type: array
          maxItems: 20000
          description: The episodes' sources in order, each a YouTube video's watch URL.
          items:
            type: string
            format: uri
            pattern: "^https://www\\.youtube\\.com/watch\\?v=[A-Za-z0-9_-]{11}$"
    NewUpload:
      type: object
      description: >-
        A file to upload. Audio (`createUpload`) is audio/mp4 or audio/webm,
        up to 5 GB, what R2 takes in one PUT; artwork (`createImageUpload`) is
        image/jpeg or image/png, up to 10 MB.
      required: [contentType, byteLength]
      properties:
        contentType:
          type: string
          enum: [audio/mp4, audio/webm, image/jpeg, image/png]
        byteLength:
          type: integer
          minimum: 1
          maximum: 5000000000
          description: The file's exact size.
    PresignedUpload:
      type: object
      required: [url, method, headers, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: Presigned S3 URL of the object in the R2 bucket that keeps it.
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            Headers to send with the body, exactly: its Content-Type, and the
            Cache-Control it is served with.
        expiresAt:
          type: string
          format: date-time
    LibraryKind:
      type: string
      enum: [show, listen, queue]
      description: >-
        `show`: an RSS show the listener follows, its feed URL `show`.
        `listen`: where they are in the episode `item` (its guid) of `show`.
        `queue`: Up Next, `show` and `item` empty.
    LibraryRecord:
      type: object
      required: [kind, show, item, updatedAt]
      properties:
        kind:
          $ref: "#/components/schemas/LibraryKind"
        show:
          type: string
          maxLength: 2000
          description: The show's RSS feed URL; empty for the queue.
        item:
          type: string
          maxLength: 2000
          description: An episode's guid; empty for a show and the queue.
        updatedAt:
          type: integer
          minimum: 0
          description: When the listener changed it, in milliseconds since the epoch, by the device's clock.
        deleted:
          type: boolean
          description: The listener removed it. Absent otherwise.
        data:
          $ref: "#/components/schemas/LibraryData"
          description: What it is now; absent once deleted.
        version:
          type: integer
          minimum: 1
          description: The push that stored it. Only from `pullLibrary`.
    LibraryData:
      type: object
      description: >-
        A record's contents, which only the app reads; each kind uses some of
        these. Up to 256 KB.
      properties:
        title:
          type: string
        author:
          type: string
        artworkUrl:
          type: string
          format: uri
        subscribedAt:
          type: integer
          description: "`show`: when the listener followed it, in ms."
        positionMs:
          type: integer
          minimum: 0
          description: "`listen`: where they stopped; 0 when they haven't started or finished."
        played:
          type: boolean
          description: "`listen`"
        playedAt:
          type: integer
          description: "`listen`: when they last played it or marked it, in ms."
        queue:
          type: array
          description: "`queue`: Up Next, in order."
          items:
            $ref: "#/components/schemas/LibraryEpisodeRef"
    LibraryEpisodeRef:
      type: object
      required: [show, item]
      properties:
        show:
          type: string
          description: The episode's show's feed URL.
        item:
          type: string
          description: The episode's guid.
    LibraryPush:
      type: object
      required: [records]
      properties:
        records:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/LibraryRecord"
    LibraryChanges:
      type: object
      required: [records, version, more]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/LibraryRecord"
        version:
          type: integer
          minimum: 0
          description: The highest version in `records`, or `since` when there are none; ask from here next.
        more:
          type: boolean
          description: More records are above `version`.
    LibraryVersion:
      type: object
      description: One `watchLibrary` event.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
    Plan:
      type: string
      enum: [free, paid]
      description: >-
        `paid` while a Local, 10 GB or 100 GB subscription bought by this
        account (or with its email) is live: the app's paid features, such as
        following YouTube playlists and channels and podcasts of the
        listener's own on their device. `User.storageLimitBytes` says whether
        it also has ListenJar Cloud; Local doesn't. Without the Cloud (Free,
        Local), listeners add videos to it only, each its own podcast for a
        day.
    User:
      type: object
      required: [id, email, name, plan]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          description: The Google account's name, or its email when it has none.
        pictureUrl:
          type: string
          format: uri
          description: The Google account's profile picture, as Google serves it; absent when it has none.
        plan:
          $ref: "#/components/schemas/Plan"
        storageLimitBytes:
          type: integer
          minimum: 1
          description: >-
            What the listener's plan stores in ListenJar Cloud, in bytes (10
            or 100 GB): the YouTube audio the app uploads, since classic
            podcasts play from their publishers and don't count. Absent
            without the Cloud: on the free plan and on Local, whose plan is
            still `paid`.
        storageUsedBytes:
          type: integer
          minimum: 0
          description: >-
            What the listener stores, in bytes: each video once, however many
            of their feeds have it, counting uploads in progress. Only from
            `getMe`.
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer token for the app. It lasts a year.
        user:
          $ref: "#/components/schemas/User"
    AuthUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    GoogleSignIn:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
          description: The `code` Google added to the redirect.
        codeVerifier:
          type: string
          description: The PKCE verifier behind the `codeChallenge` of `desktopGoogleAuthUrl`.
        redirectUri:
          type: string
          format: uri
          description: The `redirectUri` of `desktopGoogleAuthUrl`.
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    SignUp:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
    PasswordLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    WebAuthnJson:
      type: object
      description: >-
        A WebAuthn options or credential object in its JSON form (WebAuthn
        Level 3), as SimpleWebAuthn's server takes and gives them.
      additionalProperties: true
    DesktopTokenRequest:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
          format: uri
