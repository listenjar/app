openapi: 3.2.0
info:
  title: ListenJar Public API
  version: 0.1.0
  description: >-
    The API the ListenJar desktop app calls. The listeners-backend Cloudflare
    Worker serves it next to its private API, and publishes this document at
    `/public.yaml`.
servers:
  - url: https://api.listenjar.com
    description: Production.
  - url: http://localhost:8787
    description: Development, the backend's local dev server.
paths:
  /feeds:
    get:
      operationId: listFeeds
      summary: List feeds
      responses:
        "200":
          description: Feeds, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
  /feeds/{id}:
    get:
      operationId: getFeed
      summary: Get one feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "404":
          description: No feed with that id.
components:
  schemas:
    Feed:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
