language: dart
layer: application
stack: frontend
toolchains:
  default: system
fileGroups:
  youtubejs:
    - packages/youtubejs/src/**/*
    - packages/youtubejs/protos/generated/**/*
    - packages/youtubejs/package.json
    - packages/aube-workspace.yaml
    - packages/aube-lock.yaml
  sources:
    - pubspec.yaml
    - pubspec.lock
    - public.yaml
    - packages/desktop/lib/**/*
    - packages/desktop/pubspec.yaml
    - packages/desktop/{android,ios,linux,macos,windows}/**/*
    - "!packages/desktop/**/ephemeral/**/*"
    - "!packages/desktop/android/{.gradle,.kotlin,app/build}/**/*"
    - packages/youtubei/{hook,lib,native,tool}/**/*
    - packages/youtubei/pubspec.yaml
    - tool/**/*
tasks:
  install:
    description: Install the YouTube.js fork's JavaScript dependencies (its own aube workspace in packages/).
    command: aube -C packages install --frozen-lockfile --ignore-scripts
    inputs: [packages/youtubejs/package.json, packages/aube-workspace.yaml, packages/aube-lock.yaml]
    options:
      cache: false
      internal: true
      outputStyle: buffer-only-failure
  bundle:
    description: Bundle packages/youtubejs into packages/youtubei/native/youtubejs.js, which youtubei's build hook compiles in.
    deps: [~:install]
    script: >-
      aube -C packages/youtubejs exec --no-install esbuild src/platform/cf-worker.ts
      --bundle --target=es2020 --keep-names --minify --format=iife --global-name=YouTubeJS
      --define:global=globalThis --conditions=module --platform=node --log-level=warning
      --outfile=../youtubei/native/youtubejs.js
    inputs: ["@group(youtubejs)"]
    outputs: [packages/youtubei/native/youtubejs.js]
    options:
      cache: true
  scripts:
    description: >-
      Write packages/youtubei/native/scripts.g.c, the scripts youtubei's build hook compiles in
      (host.js, the bundle, bindings.js), as C string literals any C compiler takes.
    deps: [~:bundle]
    command: node packages/youtubei/tool/scripts.mjs
    inputs:
      - packages/youtubei/native/host.js
      - packages/youtubei/native/bindings.js
      - packages/youtubei/native/youtubejs.js
      - packages/youtubei/tool/scripts.mjs
    outputs: [packages/youtubei/native/scripts.g.c]
    options:
      cache: true
  codegen:
    description: >-
      Generate the Dart API client in packages/desktop/lib/backend from public.yaml with oasmith,
      and the plans and prices in packages/desktop/lib/pricing from the Stripe catalog (pricing/).
    inputs: [public.yaml, pricing/catalog.live.json, pricing/catalog.ts, tool/pricing-dart.ts]
    outputs: [packages/desktop/lib/backend/**/*, packages/desktop/lib/pricing/**/*]
    script: |-
      set -euo pipefail
      rm -rf packages/desktop/lib/backend
      oasmith --openapi public.yaml --mode client --lang dart --out packages/desktop/lib/backend
      node tool/pricing-dart.ts packages/desktop/lib/pricing/catalog.dart
    options:
      cache: true
  swift-check:
    description: >-
      Type-check the iOS and macOS runners' app delegates on Linux against stubs of the Flutter,
      UIKit and AppKit API they use (tool/swift-check; Swift from mise.toml, Linux only).
    inputs: [tool/swift-check/**/*, packages/desktop/ios/Runner/*.swift, packages/desktop/macos/Runner/AppDelegate.swift]
    script: tool/swift-check/check.sh
    options:
      cache: true
      os: linux
  windows-check:
    description: >-
      Compile the Windows runner off Windows with zig, against the Win32 and Flutter embedder
      headers (tool/windows-check; zig from mise.toml, not on Windows).
    inputs: [tool/windows-check/**/*, packages/desktop/windows/runner/**/*]
    script: tool/windows-check/check.sh
    options:
      cache: true
      os: [linux, macos]
  icons:
    description: >-
      Render every platform's app icon from resources/icon.svg: as is for release, with a DEBUG
      ribbon for debug builds (tool/icons.py; macOS with Google Chrome). The outputs are committed.
    inputs: [resources/icon.svg, tool/icons.py]
    script: python3 tool/icons.py
    options:
      cache: false
      runInCI: false
  jnigen:
    description: >-
      Regenerate the JNI bindings Dart calls the Android app's Java helpers through, after changing
      one: packages/desktop/lib/apk_installer.g.dart (ApkInstaller.java, for the updater in
      lib/apk_updates.dart) and lib/shared_links.g.dart (SharedLinks.java, for lib/shared_links.dart).
    script: cd packages/desktop && dart run tool/jnigen.dart
    inputs: []
    options:
      cache: false
      outputStyle: stream
  ffigen-ios:
    description: >-
      Regenerate packages/desktop/lib/shared_links_ios.g.dart, the Objective-C bindings
      lib/shared_links.dart calls ios/Runner/SharedLinks.swift through, after changing that file.
    script: cd packages/desktop && dart run tool/ffigen.dart
    inputs: []
    options:
      cache: false
      outputStyle: stream
      os: macos
  ffigen:
    description: Regenerate packages/youtubei/lib/src/bindings.g.dart from native/bridge.h after changing it.
    deps: [~:scripts]
    script: cd packages/youtubei && dart run tool/ffigen.dart
    inputs: []
    options:
      cache: false
      outputStyle: stream
  dev:
    description: >-
      Run the app on macOS against backend:dev on http://localhost:8787, hot reloading on every
      save under packages/*/lib (tool/dev.dart) and printing the DTD URI for the Dart MCP server.
    deps: [~:codegen, ~:scripts]
    script: dart tool/dev.dart macos
    # Uncached, so hash nothing: the default (every file in the project) walks node_modules
    # and the Flutter build tree, warning on each symlinked directory and running out of file handles.
    inputs: []
    preset: server
  build:
    description: Package the release macOS app into packages/desktop/build/macos.
    deps: [~:codegen, ~:scripts]
    inputs: ["@group(sources)"]
    outputs: [packages/desktop/build/macos/Build/Products/Release/**/*]
    script: cd packages/desktop && flutter build macos --release
    options:
      cache: true
      runInCI: false
  reinstall:
    description: >-
      Build the release macOS app with Sparkle's update key, sign it with this Mac's Developer ID
      (not notarized) and replace /Applications/ListenJar.app with it (tool/reinstall-macos.sh).
    deps: [~:codegen, ~:scripts]
    script: tool/reinstall-macos.sh
    inputs: []
    options:
      cache: false
      runInCI: false
      outputStyle: stream
      os: macos
  package-macos:
    description: >-
      Build the release macOS app with Sparkle's update key and package it as a DMG
      (tool/package-macos.sh; DEVELOPMENT.md's Releases). Signs and notarizes when given a Developer ID.
    deps: [~:codegen, ~:scripts]
    script: tool/package-macos.sh
    inputs: []
    options:
      cache: false
      runInCI: true
      outputStyle: stream
      os: macos
  package-ios:
    description: >-
      Build the release iOS app and export it for App Store Connect as
      build/release/ListenJar-<version>-ios.ipa (tool/package-ios.sh), which tool/testflight.ts
      sends to TestFlight. Signs with LISTENJAR_IOS_PROFILE's and LISTENJAR_IOS_SHARE_PROFILE's App Store profiles when given them.
    deps: [~:codegen, ~:scripts]
    script: tool/package-ios.sh
    inputs: []
    options:
      cache: false
      runInCI: true
      outputStyle: stream
      os: macos
  check:
    description: Analyze the Flutter app and youtubei.
    deps: [~:codegen, ~:scripts]
    script: flutter analyze packages/desktop packages/youtubei
    inputs: []
    options:
      cache: false
      runInCI: false
  # Releases (DEVELOPMENT.md's Releases): .github/workflows/version.yaml runs
  # release-prepare on every push to master, which tags the next version, then
  # dispatches release.yaml on that tag, which runs package-<platform> on each
  # platform's runner into build/release/ (Windows runs tool/package-windows.ps1
  # itself: moon's bash task scripts don't run there).
  release-prepare:
    description: Reserve the next version tag for the pushed master commit (GitHub Actions only).
    command: dart tool/release.dart prepare
    inputs: []
    options:
      cache: false
      runInCI: true
  package-linux:
    description: Build and package build/release/ListenJar-<version>-linux-x64.tar.gz.
    deps: [~:codegen, ~:scripts]
    command: dart tool/release.dart build linux
    inputs: []
    options:
      cache: false
      runInCI: true
      os: linux
  package-android:
    description: >-
      Build and package build/release/ListenJar-<version>-android.apk, signed with the release key
      and checked against passkeys.ts (tool/release.dart).
    deps: [~:codegen, ~:scripts]
    command: dart tool/release.dart build android
    inputs: []
    options:
      cache: false
      runInCI: true
      os: [linux, macos, windows]
