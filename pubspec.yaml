name: listenjar_desktop
publish_to: none
environment:
  sdk: ^3.14.0
workspace:
  - packages/youtubei
  - packages/desktop

dependency_overrides:
  # Windows arm64: pub.dev's 1.0.9 bundles only an x86_64 libmpv, which an
  # arm64 app can't load. media-kit's main picks its audio-only aarch64 (or
  # x86_64) libmpv from libmpv-win32-audio-cmake by FLUTTER_TARGET_PLATFORM.
  # The last commit before its pubspec joined media-kit's workspace; drop this
  # once 1.0.10 is on pub.dev.
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/media-kit/media-kit.git
      path: libs/windows/media_kit_libs_windows_audio
      ref: 7102e7da96f39c718487a8f7a59b6a034aae7f45
